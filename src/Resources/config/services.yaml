services:
    sulu_content_transfer.instance_identity:
        class: Manuxi\SuluContentTransferBundle\Instance\InstanceIdentity
        arguments:
            - '%kernel.secret%'
            - '%sulu_content_transfer.instance_id%'
            - '%sulu_content_transfer.instance_label%'
            - '@?request_stack'

    Manuxi\SuluContentTransferBundle\Instance\InstanceIdentity:
        alias: sulu_content_transfer.instance_identity

    sulu_content_transfer.package_limits:
        class: Manuxi\SuluContentTransferBundle\Package\PackageLimits
        arguments:
            - '%sulu_content_transfer.limits.max_package_size%'
            - '%sulu_content_transfer.limits.max_files%'

    Manuxi\SuluContentTransferBundle\Package\PackageLimits:
        alias: sulu_content_transfer.package_limits

    sulu_content_transfer.work_directory:
        class: Manuxi\SuluContentTransferBundle\Package\WorkDirectory
        arguments:
            - '%sulu_content_transfer.work_dir%'

    Manuxi\SuluContentTransferBundle\Package\WorkDirectory:
        alias: sulu_content_transfer.work_directory

    sulu_content_transfer.package_reader:
        class: Manuxi\SuluContentTransferBundle\Package\PackageReader
        arguments:
            - '@sulu_content_transfer.package_limits'
            - '@sulu_content_transfer.work_directory'

    Manuxi\SuluContentTransferBundle\Package\PackageReader:
        alias: sulu_content_transfer.package_reader

    sulu_content_transfer.package_writer:
        class: Manuxi\SuluContentTransferBundle\Package\PackageWriter
        arguments:
            - '@sulu_content_transfer.package_limits'
            - '@sulu_content_transfer.work_directory'

    Manuxi\SuluContentTransferBundle\Package\PackageWriter:
        alias: sulu_content_transfer.package_writer

    # --- export

    Manuxi\SuluContentTransferBundle\Instance\VersionInfo:
        factory: ['Manuxi\SuluContentTransferBundle\Instance\VersionInfo', 'detect']

    Manuxi\SuluContentTransferBundle\Reference\TemplateSchemaProvider:
        arguments:
            - '@sulu_admin.metadata_provider_registry'

    Manuxi\SuluContentTransferBundle\Reference\ReferenceScanner: ~

    Manuxi\SuluContentTransferBundle\Reference\SuluReferenceMerger: ~

    Manuxi\SuluContentTransferBundle\Reference\SuluReferenceSource:
        arguments:
            - '@sulu_content.content_view_resolver'

    Manuxi\SuluContentTransferBundle\Export\DoctrineLookupSource:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluContentTransferBundle\Export\LookupSource:
        alias: Manuxi\SuluContentTransferBundle\Export\DoctrineLookupSource

    Manuxi\SuluContentTransferBundle\Export\ReferenceLookupBuilder:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Export\LookupSource'

    Manuxi\SuluContentTransferBundle\Export\MediaExporter:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_media.storage'

    Manuxi\SuluContentTransferBundle\Export\ArticleExporter:
        arguments:
            - '@sulu_article.article_repository'
            - '@sulu_content.content_manager'
            - '@serializer'
            - '@Manuxi\SuluContentTransferBundle\Reference\TemplateSchemaProvider'
            - '@Manuxi\SuluContentTransferBundle\Reference\ReferenceScanner'
            - '@Manuxi\SuluContentTransferBundle\Reference\SuluReferenceSource'
            - '@Manuxi\SuluContentTransferBundle\Reference\SuluReferenceMerger'
            - '@Manuxi\SuluContentTransferBundle\Export\ReferenceLookupBuilder'
            - '@Manuxi\SuluContentTransferBundle\Export\MediaExporter'
            - '@sulu_content_transfer.instance_identity'
            - '@Manuxi\SuluContentTransferBundle\Instance\VersionInfo'
            - '@sulu_content_transfer.work_directory'

    Manuxi\SuluContentTransferBundle\Command\ExportCommand:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Export\ArticleExporter'
            - '@sulu_content_transfer.package_writer'
        tags:
            - { name: console.command }

    # --- import analysis

    Manuxi\SuluContentTransferBundle\Repository\TransferMappingRepository:
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments:
            - 'Manuxi\SuluContentTransferBundle\Entity\TransferMapping'

    Manuxi\SuluContentTransferBundle\Repository\TransferMappings:
        alias: Manuxi\SuluContentTransferBundle\Repository\TransferMappingRepository

    Manuxi\SuluContentTransferBundle\Import\Target\DoctrineArticleTarget:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_admin.metadata_provider_registry'

    Manuxi\SuluContentTransferBundle\Import\Target\ArticleTarget:
        alias: Manuxi\SuluContentTransferBundle\Import\Target\DoctrineArticleTarget

    Manuxi\SuluContentTransferBundle\Import\Target\DoctrineMediaTarget:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@sulu_media.storage'

    Manuxi\SuluContentTransferBundle\Import\Target\MediaTarget:
        alias: Manuxi\SuluContentTransferBundle\Import\Target\DoctrineMediaTarget

    Manuxi\SuluContentTransferBundle\Import\Target\DoctrineReferenceTarget:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluContentTransferBundle\Import\Target\ReferenceTarget:
        alias: Manuxi\SuluContentTransferBundle\Import\Target\DoctrineReferenceTarget

    Manuxi\SuluContentTransferBundle\Import\Target\WebspaceSystemTarget:
        arguments:
            - '@sulu_core.webspace.webspace_manager'
            - '%sulu_article.default_main_webspace%'

    Manuxi\SuluContentTransferBundle\Import\Target\SystemTarget:
        alias: Manuxi\SuluContentTransferBundle\Import\Target\WebspaceSystemTarget

    Manuxi\SuluContentTransferBundle\Import\ArticlePlanner:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ArticleTarget'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\SystemTarget'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ReferenceTarget'
            - '@Manuxi\SuluContentTransferBundle\Repository\TransferMappings'

    Manuxi\SuluContentTransferBundle\Import\MediaPlanner:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Import\Target\MediaTarget'
            - '@Manuxi\SuluContentTransferBundle\Repository\TransferMappings'

    Manuxi\SuluContentTransferBundle\Import\PlanStore:
        arguments:
            - '@sulu_content_transfer.work_directory'

    Manuxi\SuluContentTransferBundle\Import\ImportAnalyzer:
        arguments:
            - '@sulu_content_transfer.package_reader'
            - '@Manuxi\SuluContentTransferBundle\Import\PlanStore'
            - '@sulu_content_transfer.instance_identity'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ArticleTarget'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ReferenceTarget'
            - '@Manuxi\SuluContentTransferBundle\Import\ArticlePlanner'
            - '@Manuxi\SuluContentTransferBundle\Import\MediaPlanner'
            - '@Manuxi\SuluContentTransferBundle\Repository\TransferMappings'

    # --- import execution

    Manuxi\SuluContentTransferBundle\Import\Write\SecurityImportUserContext:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@security.token_storage'

    Manuxi\SuluContentTransferBundle\Import\Write\ImportUserContext:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\SecurityImportUserContext

    Manuxi\SuluContentTransferBundle\Import\Write\DoctrineTransaction:
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@doctrine'

    Manuxi\SuluContentTransferBundle\Import\Write\Transaction:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\DoctrineTransaction

    Manuxi\SuluContentTransferBundle\Import\Write\MessageArticleWriter:
        arguments:
            - '@sulu_message_bus'

    Manuxi\SuluContentTransferBundle\Import\Write\ArticleWriter:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\MessageArticleWriter

    Manuxi\SuluContentTransferBundle\Import\Write\SuluTaxonomyWriter:
        arguments:
            - '@sulu_category.category_manager'
            - '@sulu_tag.tag_manager'
            - '@doctrine.orm.entity_manager'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\ImportUserContext'

    Manuxi\SuluContentTransferBundle\Import\Write\TaxonomyWriter:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\SuluTaxonomyWriter

    Manuxi\SuluContentTransferBundle\Import\Write\SuluMediaWriter:
        arguments:
            - '@sulu_media.media_manager'
            - '@sulu_media.format_options_manager'
            - '@sulu_media.system_collections.manager'
            - '@doctrine.orm.entity_manager'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\ImportUserContext'

    Manuxi\SuluContentTransferBundle\Import\Write\MediaWriter:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\SuluMediaWriter

    Manuxi\SuluContentTransferBundle\Import\Write\SuluAdminLinks:
        arguments:
            - '@sulu_admin.metadata_group_provider'

    Manuxi\SuluContentTransferBundle\Import\Write\AdminLinks:
        alias: Manuxi\SuluContentTransferBundle\Import\Write\SuluAdminLinks

    Manuxi\SuluContentTransferBundle\Import\Rewrite\ReferenceRewriter: ~

    Manuxi\SuluContentTransferBundle\Import\ImportExecutor:
        arguments:
            - '@sulu_content_transfer.package_reader'
            - '@Manuxi\SuluContentTransferBundle\Import\PlanStore'
            - '@Manuxi\SuluContentTransferBundle\Import\ImportAnalyzer'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\ImportUserContext'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\TaxonomyWriter'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\MediaWriter'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\ArticleWriter'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\Transaction'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ArticleTarget'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ReferenceTarget'
            - '@Manuxi\SuluContentTransferBundle\Repository\TransferMappings'
            - '@Manuxi\SuluContentTransferBundle\Import\Rewrite\ReferenceRewriter'
            - '@Manuxi\SuluContentTransferBundle\Import\Write\AdminLinks'
        calls:
            - [setLogger, ['@?logger']]

    Manuxi\SuluContentTransferBundle\Command\ImportCommand:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Import\ImportAnalyzer'
            - '@Manuxi\SuluContentTransferBundle\Import\ImportExecutor'
        tags:
            - { name: console.command }

    # --- admin: export

    Manuxi\SuluContentTransferBundle\Security\ArticleSecurityContexts:
        arguments:
            - '@sulu_admin.metadata_group_provider'

    Manuxi\SuluContentTransferBundle\Export\DoctrineArticleTemplates:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluContentTransferBundle\Export\ArticleTemplates:
        alias: Manuxi\SuluContentTransferBundle\Export\DoctrineArticleTemplates

    Manuxi\SuluContentTransferBundle\Security\ExportAccess:
        arguments:
            - '@sulu_security.security_checker'
            - '@Manuxi\SuluContentTransferBundle\Security\ArticleSecurityContexts'
            - '@Manuxi\SuluContentTransferBundle\Export\ArticleTemplates'

    Manuxi\SuluContentTransferBundle\Controller\Admin\ExportController:
        public: true
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Export\ArticleExporter'
            - '@sulu_content_transfer.package_writer'
            - '@sulu_content_transfer.work_directory'
            - '@Manuxi\SuluContentTransferBundle\Security\ExportAccess'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    # --- admin: import

    Manuxi\SuluContentTransferBundle\Security\DoctrineMediaCollectionLookup:
        arguments:
            - '@doctrine.orm.entity_manager'

    Manuxi\SuluContentTransferBundle\Security\MediaCollectionLookup:
        alias: Manuxi\SuluContentTransferBundle\Security\DoctrineMediaCollectionLookup

    Manuxi\SuluContentTransferBundle\Security\ImportAccess:
        arguments:
            - '@sulu_security.security_checker'
            - '@Manuxi\SuluContentTransferBundle\Security\ArticleSecurityContexts'
            - '@Manuxi\SuluContentTransferBundle\Security\MediaCollectionLookup'
            - '@sulu_media.system_collections.manager'
            - '@Manuxi\SuluContentTransferBundle\Export\ArticleTemplates'

    Manuxi\SuluContentTransferBundle\Import\PlanPresenter:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Security\ImportAccess'
            - '@Manuxi\SuluContentTransferBundle\Import\Target\ArticleTarget'

    Manuxi\SuluContentTransferBundle\Controller\Admin\ImportController:
        public: true
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Import\ImportAnalyzer'
            - '@Manuxi\SuluContentTransferBundle\Import\ImportExecutor'
            - '@Manuxi\SuluContentTransferBundle\Import\PlanStore'
            - '@Manuxi\SuluContentTransferBundle\Import\PlanPresenter'
            - '@Manuxi\SuluContentTransferBundle\Security\ImportAccess'
            - '@Manuxi\SuluContentTransferBundle\Import\Upload\UploadValidator'
            - '@security.token_storage'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    Manuxi\SuluContentTransferBundle\Import\Upload\UploadValidator:
        arguments:
            - '@sulu_content_transfer.package_limits'

    Manuxi\SuluContentTransferBundle\EventListener\ImportUploadListener:
        arguments:
            - '@Manuxi\SuluContentTransferBundle\Import\Upload\UploadValidator'
        tags:
            # after the firewall (8) and the router (32), before the listener of the media bundle (0) that inspects uploads
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 4 }

    Manuxi\SuluContentTransferBundle\Admin\ContentTransferAdmin:
        arguments:
            - '@sulu_security.security_checker'
            - '@Manuxi\SuluContentTransferBundle\Security\ArticleSecurityContexts'
            - '%sulu_content_transfer.admin.toolbar%'
            - '%sulu_content_transfer.admin.merge_csv_export%'
            - '%sulu_content_transfer.admin.article_csv_export%'
            - '@?logger'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }
